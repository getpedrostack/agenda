<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1c20">
<title>Agenda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cobre:#ba744d;--caramelo:#da9c5e;--pessego:#fad9b8;
  --bg:#0a1c20;--surface:#0f272c;--surface-2:#14323a;--border:#23474f;--text:#f7efe6;--dim:#b3c0be;
  --acao:#5bb8bd;--acao-bg:#0f3036;--tinta:#062024;
  --abas:62px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acao);outline-offset:2px}

/* ---------- casca ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;gap:8px;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left))}
.top .mes{flex:1;min-width:0;font-size:22px;font-weight:900;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mes small{display:block;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.pill{font-size:12px;font-weight:800;border:1.5px solid var(--acao);color:var(--acao);border-radius:999px;padding:6px 12px;flex-shrink:0}
.engrenagem{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex-shrink:0;margin-bottom:-4px}
.engrenagem svg{width:22px;height:22px}
.corpo{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 calc(12px + env(safe-area-inset-right)) 96px calc(12px + env(safe-area-inset-left));scrollbar-width:none}
.corpo::-webkit-scrollbar{display:none}
.tabs{flex-shrink:0;display:flex;height:calc(var(--abas) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
.tabs button[aria-current="page"]{color:var(--acao)}
.tabs i{width:20px;height:14px;border:2px solid currentColor;border-radius:4px;display:block}
.tabs .t-linha i{border-width:0;border-top:2px solid;border-bottom:2px solid;height:12px;border-radius:0}
.tabs .t-semana i{background:linear-gradient(90deg,transparent 30%,currentColor 30% 38%,transparent 38% 62%,currentColor 62% 70%,transparent 70%)}
.tabs .t-mes i{background:radial-gradient(currentColor 1.2px,transparent 1.6px) 0 0/5px 5px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(var(--abas) + 14px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--acao);color:var(--tinta);font-size:30px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}

/* ---------- linha do tempo ---------- */
.day{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.dnum{width:30px;height:30px;border-radius:50%;border:2px solid var(--text);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;flex-shrink:0}
.dlbl{font-weight:800;font-size:15px;flex:1;min-width:0}
.dlbl em{font-style:normal;color:var(--dim);font-weight:600;font-size:12px;margin-left:6px}
.day.hoje .dnum{background:var(--acao);border-color:var(--acao);color:var(--tinta)}
.day.hoje .dlbl{color:var(--acao)}
.cnt{font-size:11px;color:var(--dim);font-family:var(--mono)}
.task{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c,var(--acao));border-radius:12px;margin-bottom:8px;min-width:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease,opacity .18s ease}
.task.arrastando{transition:none}
.task .abrir{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 0 12px 12px;text-align:left}
.task .t{font-family:var(--mono);font-size:12px;color:var(--dim);width:40px;flex-shrink:0}
.task .ti{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.task .ti small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:2px}
.task .ck{width:46px;align-self:stretch;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task .ck i{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);position:relative;display:block}
.task.feito{opacity:.5}
.task.feito .ti{text-decoration:line-through}
.task.feito .ck i{background:var(--acao);border-color:var(--acao)}
.task.feito .ck i:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--tinta);border-width:0 2px 2px 0;transform:rotate(45deg)}
.gap{width:100%;height:44px;border:1.5px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;font-weight:600;margin-bottom:6px}
.vazio{font-size:11px;color:var(--dim);text-align:center;padding:6px 0 2px;letter-spacing:.5px}
.agora{display:flex;align-items:center;gap:6px;margin:-2px 0 8px;color:var(--cobre);font-size:10px;font-weight:800;font-family:var(--mono)}
.agora:after{content:"";flex:1;height:2px;background:var(--cobre);border-radius:2px}

/* ---------- semana ---------- */
.wkbar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 10px;font-size:12px;color:var(--dim);font-weight:600}
.wkbar b{color:var(--text)}
.wkbar button{color:var(--dim);font-size:12px;font-weight:700;min-height:44px;padding:0 8px}
.wkbar button:first-child{margin-left:-8px}
.wkbar button:last-child{margin-right:-8px}
.week{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:12px;margin:0 -12px;padding:0 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.week::-webkit-scrollbar{display:none}
.col{flex:0 0 122px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.colh{text-align:center;padding:8px 0;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.colh small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--dim);font-weight:800;text-transform:uppercase}
.colh span{font-family:var(--mono);font-size:20px;font-weight:700}
.col.hoje .colh{background:var(--acao);border-color:var(--acao);color:var(--tinta)}
.col.hoje .colh small{color:var(--tinta)}
.col.passado{opacity:.55}
.mini{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--c,var(--acao));border-radius:10px;padding:8px}
.mini .t{display:block;font-family:var(--mono);font-size:10px;color:var(--dim)}
.mini .ti{display:block;font-size:12px;font-weight:700;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.mini.feito .ti{text-decoration:line-through;opacity:.6}
.mk{flex:none;font-size:11px;font-weight:600;color:var(--dim);margin-left:6px;white-space:nowrap}
.task .ti .mk{display:inline;font-size:11px}
.mini .lin{display:flex;align-items:baseline;margin-top:2px;min-width:0}
.mini .lin .ti{flex:1;min-width:0;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .lin .mk{margin-left:4px;font-size:10px}
.livre{flex:1;min-height:60px;width:100%;border:1.5px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px}

/* ---------- mês ---------- */
.wkbar .seta{font-size:22px;line-height:1;font-weight:500;min-width:44px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.grid .wd{text-align:center;font-size:10px;font-weight:800;color:var(--dim);padding:4px 0 6px}
.cell{aspect-ratio:1/1.12;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);position:relative;min-width:0}
.cell.passado{color:var(--dim)}
.cell.out{background:transparent;color:var(--border)}
.cell.hoje{background:var(--acao);color:var(--tinta)}
.cell.sel{outline:2px solid var(--caramelo);outline-offset:-2px}
.cell .pts{display:flex;align-items:center;gap:2px;margin-top:5px;height:5px}
.cell .pts i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--acao));display:block}
.cell .pts b{font-size:8px;line-height:5px;font-weight:800;color:var(--dim)}
.cell.out .pts{opacity:.5}
.cell.hoje .pts i{background:var(--tinta)}
.cell.hoje .pts b{color:var(--tinta)}
.mlist{padding:14px 0 0}
.mlist h4{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--caramelo);margin-bottom:8px}
.mlist .nada{font-size:12px;color:var(--dim);text-align:center;padding:2px 0 10px}

/* ---------- folha de novo/editar ---------- */
.veu{position:fixed;inset:0;background:rgba(3,10,12,.72);z-index:20;opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
.veu.aberta{opacity:1;visibility:visible;transition:opacity .22s}
.folha{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border);border-radius:24px 24px 0 0;z-index:21;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.folha.aberta{transform:none;visibility:visible;transition:transform .22s ease}
.folha.arrastando{transition:none}
.folha-topo{flex-shrink:0;padding:10px 16px 12px;touch-action:none;cursor:grab}
.alca{display:block;width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.folha h2{font-size:17px;font-weight:900}
.folha h2:focus{outline:none}
.folha-form{flex:1;min-height:0;display:flex;flex-direction:column}
.folha-campos{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
.fld{display:block;width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;outline:none}
.fld::placeholder{color:var(--dim);font-weight:500}
.fld:focus{border-color:var(--acao);box-shadow:0 0 0 3px rgba(91,184,189,.18)}
.lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:4px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:12px;font-weight:700;padding:7px 11px;min-height:34px;border-radius:999px;border:1.5px solid var(--border);color:var(--dim);background:none}
.chip[aria-pressed="true"],.chip.on{border-color:var(--acao);color:var(--acao);background:var(--acao-bg)}
input.chip{font-family:var(--mono);min-width:96px;color-scheme:dark;outline:none}
input.chip:focus-visible{outline:2px solid var(--acao);outline-offset:2px}
.outra{position:relative}
.outra input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.cores{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px;margin-bottom:12px}
.cores button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.cores button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--text)}
/* anotação: 3 linhas que crescem até 8 (sem field-sizing, o script ajusta a altura) */
textarea.fld{resize:none;font-weight:500;line-height:1.4;min-height:calc(4.2em + 27px);max-height:calc(11.2em + 27px);field-sizing:content;overflow-y:auto}
.contador{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;margin:-6px 2px 10px}
.contador.cheio{color:var(--caramelo)}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.foto{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--bg);border:1.5px solid var(--border);flex-shrink:0}
.foto img{display:block;width:100%;height:100%;object-fit:cover}
.bt-foto{min-height:64px;border-style:dashed;border-radius:10px;padding:0 14px}
.preparando{min-height:64px;display:flex;align-items:center;padding:0 4px;font-size:12px;font-weight:700;color:var(--dim)}
.preparando[hidden]{display:none}
.fotos-aviso{font-size:12px;font-weight:600;color:var(--dim);margin:-2px 0 10px}
.folha-acoes{flex-shrink:0;display:flex;gap:10px;padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
.btn{flex:1;background:var(--acao);color:var(--tinta);font-weight:900;border-radius:14px;padding:14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.bt-apagar{border:1.5px solid var(--border);color:var(--caramelo);font-weight:800;border-radius:14px;padding:14px 18px;font-size:15px}

/* ---------- ajustes ---------- */
.aj-sec{margin-bottom:18px}
.aj-sec[inert]{opacity:.35}
.aj-cat{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.aj-cat .fld{flex:1;min-width:0;margin-bottom:0}
.aj-dot{width:22px;height:22px;border-radius:50%;background:var(--c);flex-shrink:0;margin:0 4px}
.aj-bk{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:12px}
.aj-bk.nenhum{color:var(--cobre)}
.aj-botoes{display:flex;gap:10px}
.btn-sec{flex:1;border:1.5px solid var(--acao);color:var(--acao);font-weight:800;border-radius:14px;padding:13px 8px;font-size:14px}
.aj-conf{background:var(--surface-2);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:18px}
.aj-conf p{font-weight:800;font-size:15px;margin-bottom:4px}
.aj-conf small{display:block;color:var(--dim);font-size:12px;line-height:1.35;margin-bottom:12px}
.aj-conf .btn,.aj-conf .btn-sec,.aj-conf .bt-apagar{display:block;width:100%;flex:none;margin-bottom:8px}
.aj-conf :last-child{margin-bottom:0}
.aj-antigos{display:flex;align-items:center;gap:10px;margin-top:14px}
.aj-antigos .aj-bk{flex:1;min-width:0;margin-bottom:0;color:var(--cobre)}
.aj-antigos .btn-sec{flex:none;padding:11px 12px;font-size:13px}

/* ---------- aviso (toast) ---------- */
.toast{position:fixed;left:calc(12px + env(safe-area-inset-left));right:calc(84px + env(safe-area-inset-right));bottom:calc(var(--abas) + 14px + env(safe-area-inset-bottom));min-height:56px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;font-weight:600;line-height:1.3;z-index:30;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.visivel{opacity:1;transform:none;pointer-events:auto}
.toast .msg{min-width:0}
.toast .sep{color:var(--dim)}
.toast button{color:var(--acao);font-weight:800;padding:0 10px;min-height:44px;flex-shrink:0}

/* ---------- visualizador de fotos (tela cheia, acima da folha e abaixo do aviso) ---------- */
.visor{position:fixed;inset:0;z-index:25;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.visor[hidden]{display:none}
.visor-palco{position:absolute;inset:0;overflow:hidden}
.visor-palco img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none}
.visor-palco img.anima{transition:transform .2s ease-out}
.visor-barra{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 18px calc(10px + env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));pointer-events:none}
.visor-barra button{pointer-events:auto;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;background:rgba(15,39,44,.78);border:1px solid var(--border);font-size:14px;font-weight:800}
.visor-barra #visor-remover{color:var(--caramelo)}
.visor-cont{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);text-shadow:0 1px 3px #000}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

@media (prefers-reduced-motion:reduce){.veu,.folha,.toast,.task,.visor-palco img{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="mes"><small id="rotulo-aba">Linha do tempo</small><span id="rotulo-mes"></span></div>
    <button type="button" class="pill" id="bt-hoje">Hoje</button>
    <button type="button" class="engrenagem" id="bt-ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main class="corpo" id="corpo"></main>
  <nav class="tabs" aria-label="Visualizações">
    <button type="button" class="t-linha" data-aba="linha"><i></i>Linha</button>
    <button type="button" class="t-semana" data-aba="semana"><i></i>Semana</button>
    <button type="button" class="t-mes" data-aba="mes"><i></i>Mês</button>
  </nav>
  <button type="button" class="fab" id="bt-novo" aria-label="Nova tarefa">+</button>
</div>
<div class="veu" id="veu"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
  <div class="folha-topo" id="folha-topo"><i class="alca" aria-hidden="true"></i><h2 id="folha-titulo">Novo compromisso</h2></div>
  <form class="folha-form" id="folha-form" novalidate autocomplete="off">
    <div class="folha-campos" id="folha-campos">
      <input class="fld" id="f-titulo" type="text" placeholder="O que é o compromisso?" aria-label="Título" enterkeyhint="done">
      <div class="lbl" id="lbl-nota">Anotação</div>
      <textarea class="fld" id="f-nota" rows="3" aria-labelledby="lbl-nota" aria-describedby="f-nota-cont" placeholder="Opcional"></textarea>
      <div class="contador" id="f-nota-cont" hidden></div>
      <div class="lbl" id="lbl-dia">Dia</div>
      <div class="chips" id="f-dias" role="group" aria-labelledby="lbl-dia">
        <span class="outra" id="f-outra"><button type="button" class="chip" id="f-outra-bt">📅 outra data</button><input type="date" id="f-data" tabindex="-1" aria-hidden="true"></span>
      </div>
      <div class="lbl" id="lbl-hora">Hora</div>
      <div class="chips" role="group" aria-labelledby="lbl-hora">

<script id="nucleo">
// Núcleo puro: datas e montagem das visualizações (sem DOM, sem storage).
(function () {
  const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const COR_PADRAO = '#5bb8bd';
  const p2 = (n) => String(n).padStart(2, '0');

  function isoDia(d) {
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  function deIso(iso) {
    const [a, m, d] = iso.split('-').map(Number);
    return new Date(a, m - 1, d);
  }
  function somaDias(iso, n) {
    const d = deIso(iso);
    d.setDate(d.getDate() + n);
    return isoDia(d);
  }
  function diasEntre(a, b) {
    return Math.round((deIso(b) - deIso(a)) / 86400000);
  }
  function inicioSemana(iso) {
    return somaDias(iso, -deIso(iso).getDay());
  }
  function ordenarDia(tarefas) {
    return tarefas.slice().sort((x, y) => {
      if (!x.hora !== !y.hora) return x.hora ? 1 : -1;
      if (x.hora !== y.hora) return x.hora < y.hora ? -1 : 1;
      return (x.criadoEm || 0) - (y.criadoEm || 0);
    });
  }
  function porDia(tarefas) {
    const mapa = new Map();
    for (const t of tarefas) {
      if (!mapa.has(t.data)) mapa.set(t.data, []);
      mapa.get(t.data).push(t);
    }
    return mapa;
  }
  function montarLinha(tarefas, hojeIso) {
    const mapa = porDia(tarefas);
    mapa.set(hojeIso, mapa.get(hojeIso) || []);
    const datas = [...mapa.keys()].sort();
    const itens = [];
    datas.forEach((data, i) => {
      if (i > 0) {
        const n = diasEntre(datas[i - 1], data) - 1;
        if (n >= 1) itens.push({ tipo: 'livres', de: somaDias(datas[i - 1], 1), ate: somaDias(data, -1), n });
      }
      itens.push({ tipo: 'dia', data, tarefas: ordenarDia(mapa.get(data)) });
    });
    return itens;
  }
  function curto(iso) {
    const d = deIso(iso);
    return d.getDate() + ' ' + MESES[d.getMonth()];
  }
  function rotuloLivres(de, ate, n) {
    if (n > 3) return curto(de) + ' – ' + curto(ate) + ' · ' + n + ' dias livres';
    const nomes = [];
    for (let i = 0; i < n; i++) {
      const d = deIso(somaDias(de, i));
      nomes.push(DIAS[d.getDay()] + ' ' + d.getDate());
    }
    return nomes.join(' · ') + ' — livres';
  }
  function semana(tarefas, inicioIso) {
    const mapa = porDia(tarefas);
    return Array.from({ length: 7 }, (_, i) => {
      const data = somaDias(inicioIso, i);
      return { data, tarefas: ordenarDia(mapa.get(data) || []) };
    });
  }
  function gradeMes(ano, mes0) {
    const primeiro = isoDia(new Date(ano, mes0, 1));
    const inicio = inicioSemana(primeiro);
    const ultimo = isoDia(new Date(ano, mes0 + 1, 0));
    const celulas = Math.max(35, Math.ceil((diasEntre(inicio, ultimo) + 1) / 7) * 7);
    return Array.from({ length: celulas }, (_, i) => {
      const data = somaDias(inicio, i);
      return { data, doMes: deIso(data).getMonth() === mes0 };
    });
  }
  function pontosDia(tarefas, iso, cats) {
    const doDia = ordenarDia(tarefas.filter((t) => t.data === iso));
    const cor = (id) => {
      const c = cats.find((x) => x.id === id);
      return c ? c.cor : COR_PADRAO;
    };
    return { cores: doDia.slice(0, 3).map((t) => cor(t.cat)), mais: doDia.length > 3 };
  }

  // ---- Estado, persistência e backup ----
  const CATS_PADRAO = [
    { id: 'pessoal', nome: 'Pessoal', cor: '#5bb8bd' },
    { id: 'torrefacao', nome: 'Torrefação', cor: '#ba744d' },
    { id: 'forro', nome: 'Forró', cor: '#da9c5e' },
    { id: 'saude', nome: 'Saúde', cor: '#fad9b8' },
  ];
  const copia = (x) => JSON.parse(JSON.stringify(x));
  const ehObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);

  const LIMITE_NOTA = 500;
  const LIMITE_FOTOS = 6;
  const LIMITE_DATAURL = 15 * 1024 * 1024; // uma foto reduzida tem ~0,5 MB; acima disso o arquivo é suspeito
  const notaOk = (n) => n === undefined || (typeof n === 'string' && n.length <= LIMITE_NOTA);
  const fotosOk = (f) => f === undefined || (Array.isArray(f) && f.length <= LIMITE_FOTOS &&
    f.every((id) => typeof id === 'string' && id !== '') && new Set(f).size === f.length);
  const tarefaValida = (t) => ehObj(t) && typeof t.id === 'string' && t.id !== '' &&
    typeof t.titulo === 'string' && typeof t.data === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.data) &&
    notaOk(t.nota) && fotosOk(t.fotos);
  const COR_HEX = /^#[0-9a-f]{6}$/i;
  const catValida = (c) => ehObj(c) && ['id', 'nome'].every((k) => typeof c[k] === 'string' && c[k] !== '') &&
    typeof c.cor === 'string' && COR_HEX.test(c.cor);
  // Sem cats usa o padrão; com cats, precisa ter ao menos uma categoria válida.
  const catsOk = (cats) => cats === undefined || (Array.isArray(cats) && cats.length > 0 && cats.every(catValida));

  function estadoInicial() {
    return { tarefas: [], cats: copia(CATS_PADRAO) };
  }

  function carregar(texto) {
    if (texto === null || texto === undefined) return { estado: estadoInicial(), corrompido: false };
    let obj;
    try { obj = JSON.parse(texto); } catch (e) { obj = null; }
    if (!ehObj(obj) || !Array.isArray(obj.tarefas) || !obj.tarefas.every(tarefaValida) || !catsOk(obj.cats)) {
      return { estado: estadoInicial(), corrompido: true };
    }
    return {
      estado: { tarefas: copia(obj.tarefas), cats: Array.isArray(obj.cats) ? copia(obj.cats) : copia(CATS_PADRAO) },
      corrompido: false,
    };
  }

  function normalizarNota(texto) {
    return typeof texto === 'string' ? texto.trim().slice(0, LIMITE_NOTA).trim() : '';
  }

  function idsFotos(tarefas) {
    const ids = new Set();
    for (const t of tarefas) for (const id of (t.fotos || [])) ids.add(id);
    return [...ids];
  }

  function novaTarefa({ titulo, data, hora, cat, nota, fotos }, agora) {
    const t = typeof titulo === 'string' ? titulo.trim() : '';
    if (!t) throw new Error('titulo');
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      titulo: t,
      data,
      hora: hora || null,
      cat,
      nota: normalizarNota(nota),
      fotos: Array.isArray(fotos) ? fotos.slice() : [],
      feito: false,
      criadoEm: agora.getTime(),
    };
  }

  function exportar(estado, agora, fotos = {}) {
    const dados = { app: 'agenda', versao: 2, exportadoEm: agora.toISOString(), tarefas: estado.tarefas, cats: estado.cats, fotos: Object.assign({}, fotos) };
    return { nome: 'agenda-backup-' + isoDia(agora) + '.json', conteudo: JSON.stringify(dados, null, 2) };
  }

  // Só os formatos que o app produz/aceita, e só base64 de verdade (SVG e afins ficam de fora: seriam um documento ativo).
  const DATAURL_FOTO = /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/;

  function validarBackup(obj) {
    if (!ehObj(obj) || obj.app !== 'agenda' || !Array.isArray(obj.tarefas)) {
      return { ok: false, erro: 'Este arquivo não é um backup da Agenda.' };
    }
    if (obj.versao !== undefined && obj.versao !== 1 && obj.versao !== 2) {
      return { ok: false, erro: 'Este arquivo não é um backup da Agenda.' };
    }
    if (!obj.tarefas.every(tarefaValida)) return { ok: false, erro: 'Backup com compromisso inválido.' };
    if (!catsOk(obj.cats)) return { ok: false, erro: 'Backup com categoria inválida.' };
    let fotos = {};
    if (obj.versao === 2) {
      if (!ehObj(obj.fotos) || !Object.values(obj.fotos).every((v) => typeof v === 'string' && v.length <= LIMITE_DATAURL && DATAURL_FOTO.test(v))) {
        return { ok: false, erro: 'Backup com foto inválida.' };
      }
      fotos = Object.assign({}, obj.fotos);
    }
    return { ok: true, tarefas: copia(obj.tarefas), cats: Array.isArray(obj.cats) ? copia(obj.cats) : copia(CATS_PADRAO), fotos };
  }

  function juntar(estado, backup) {
    const ids = new Set(estado.tarefas.map((t) => t.id));
    const catIds = new Set(estado.cats.map((c) => c.id));
    return {
      tarefas: copia(estado.tarefas).concat(copia((backup.tarefas || []).filter((t) => !ids.has(t.id)))),
      cats: copia(estado.cats).concat(copia((backup.cats || []).filter((c) => !catIds.has(c.id)))),
    };
  }

  globalThis.Nucleo = { isoDia, deIso, somaDias, inicioSemana, ordenarDia, montarLinha, rotuloLivres, semana, gradeMes, pontosDia, CATS_PADRAO, LIMITE_NOTA, LIMITE_FOTOS, normalizarNota, idsFotos, estadoInicial, carregar, novaTarefa, exportar, validarBackup, juntar };
})();
</script>
<script id="ui">
// UI: lê/grava o localStorage e desenha a aba atual a partir de `estado`.
const CHAVE = 'agenda.v1';
const CHAVE_CORROMPIDO = 'agenda.v1.corrompido';
const CHAVE_ABA = 'agenda.aba';
const ABAS = ['linha', 'semana', 'mes'];
const COR_SEM_CAT = '#5bb8bd';
const DIAS_LONGOS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const DIAS_CURTOS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MESES_LONGOS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const MSG_FALHA = 'Não foi possível salvar no aparelho.';
const ROTULO_ABA = { linha: 'Linha do tempo', semana: 'Semana', mes: 'Calendário' };

// ---- armazenamento ----
function lerArmazenado(chave) {
  try { return localStorage.getItem(chave); } catch (e) { console.warn('Agenda: não consegui ler ' + chave, e); return null; }
}
function gravarArmazenado(chave, valor) {
  try { localStorage.setItem(chave, valor); return true; } catch (e) { console.warn('Agenda: não consegui gravar ' + chave, e); return false; }
}

// ---- fotos (IndexedDB, só neste aparelho) ----
const MSG_FOTOS = 'Não foi possível guardar fotos neste aparelho.';
function avisarFotos() { toast(MSG_FOTOS); }
const Fotos = (() => {
  const BANCO = 'agenda-fotos';
  const LOJA = 'fotos';
  const LADO_MAX = 1600;
  const QUALIDADE = 0.82;
  let conexao = null; // promessa da conexão única, aberta só quando preciso

  function abrir() {
    if (conexao) return conexao;
    conexao = new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') { reject(new Error('indexeddb')); return; }
      let req;
      try { req = indexedDB.open(BANCO, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(LOJA)) req.result.createObjectStore(LOJA);
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => { db.close(); conexao = null; };
        db.onclose = () => { conexao = null; }; // fechada pelo navegador: a próxima chamada reabre
        resolve(db);
      };
      req.onerror = () => reject(req.error || new Error('indexeddb'));
      req.onblocked = () => reject(new Error('indexeddb'));
    });
    conexao.catch(() => { conexao = null; }); // falhou: a próxima chamada tenta de novo
    return conexao;
  }

  // Executa `fn(store)` numa transação; resolve com o valor de `fn` quando ela completa.
  async function transacao(modo, fn) {
    const db = await abrir();
    return new Promise((resolve, reject) => {
      let valor;
      let tx;
      try {
        tx = db.transaction(LOJA, modo);
        tx.oncomplete = () => resolve(valor && valor.result !== undefined ? valor.result : undefined);
        tx.onerror = () => reject(tx.error || new Error('indexeddb'));
        tx.onabort = () => reject(tx.error || new Error('indexeddb'));
        valor = fn(tx.objectStore(LOJA));
      } catch (e) { reject(e); }
    });
  }

  function novoId() {
    return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function guardar(id, blob) {
    return transacao('readwrite', (s) => { s.put(blob, id); }).then(() => undefined);
  }
  async function ler(id) {
    const r = await transacao('readonly', (s) => s.get(id));
    return r === undefined ? null : r;
  }
  function apagar(ids) {
    if (!ids || !ids.length) return Promise.resolve();
    return transacao('readwrite', (s) => { ids.forEach((id) => s.delete(id)); }).then(() => undefined);
  }
  async function listarIds() {
    const r = await transacao('readonly', (s) => s.getAllKeys());
    return (r || []).map(String);
  }
  // idsEmUso: lista ou função que devolve a lista. A função é chamada só depois de listar o banco,
  // para enxergar uma gravação que tenha terminado nesse meio-tempo.
  async function limparOrfas(idsEmUso) {
    const todos = await listarIds();
    const emUso = new Set(typeof idsEmUso === 'function' ? idsEmUso() : idsEmUso);
    await apagar(todos.filter((id) => !emUso.has(id)));
  }

  // <img> carregado (sem decode()): dá as medidas pelo cabeçalho, sem decodificar a foto inteira.
  async function carregarImg(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.decoding = 'async';
      await new Promise((ok, falha) => { img.onload = ok; img.onerror = () => falha(new Error('formato')); img.src = url; });
      return img;
    } finally { URL.revokeObjectURL(url); }
  }
  // Foto grande: o navegador já decodifica reduzida (resizeWidth/Height), sem um bitmap de 12 MP na memória.
  // Só o lado maior é pedido e o outro sai na proporção; se a orientação EXIF trocar os lados,
  // o bitmap sai um pouco maior que 1600 e o canvas termina a redução — a proporção nunca distorce.
  async function decodificar(file) {
    let img = null;
    try { img = await carregarImg(file); } catch (e) { /* tenta só o createImageBitmap */ }
    const iw = img ? img.naturalWidth : 0, ih = img ? img.naturalHeight : 0;
    const opcoes = { imageOrientation: 'from-image' };
    if (Math.max(iw, ih) > LADO_MAX) {
      opcoes.resizeQuality = 'high';
      if (iw >= ih) opcoes.resizeWidth = LADO_MAX; else opcoes.resizeHeight = LADO_MAX;
    }
    try {
      const bmp = await createImageBitmap(file, opcoes);
      return { fonte: bmp, w: bmp.width, h: bmp.height, fechar: () => bmp.close() };
    } catch (e) { /* cai no <img> */ }
    if (!img) throw new Error('formato');
    return { fonte: img, w: iw, h: ih, fechar: () => {} };
  }
  async function reduzir(file) {
    let dec;
    try { dec = await decodificar(file); } catch (e) { throw new Error('formato'); }
    try {
      if (!dec.w || !dec.h) throw new Error('formato');
      const k = Math.min(1, LADO_MAX / Math.max(dec.w, dec.h));
      const w = Math.max(1, Math.round(dec.w * k));
      const h = Math.max(1, Math.round(dec.h * k));
      const usaOff = typeof OffscreenCanvas !== 'undefined';
      const cv = usaOff ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h });
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(dec.fonte, 0, 0, w, h);
      const blob = usaOff
        ? await cv.convertToBlob({ type: 'image/jpeg', quality: QUALIDADE })
        : await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', QUALIDADE));
      if (!blob) throw new Error('formato');
      return blob;
    } finally { dec.fechar(); }
  }

  function paraDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error || new Error('dataurl'));
      fr.readAsDataURL(blob);
    });
  }
  function deDataUrl(str) {
    const m = typeof str === 'string' && /^data:image\/(jpeg|png|webp);base64,([A-Za-z0-9+/]+={0,2})$/.exec(str);
    if (!m) throw new Error('dataurl');
    let bin;
    try { bin = atob(m[2]); } catch (e) { throw new Error('dataurl'); }
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'image/' + m[1] }); // sempre um tipo da lista, nunca o que veio no arquivo
  }

  return Object.freeze({ novoId, guardar, ler, apagar, listarIds, reduzir, paraDataUrl, deDataUrl, limparOrfas });
})();

const boot = (() => {
  let texto;
  try {
    texto = localStorage.getItem(CHAVE);
  } catch (e) {
    // Não deu para ler: abre vazio, mas sem gravar nada por cima do agenda.v1 que pode existir.
    console.warn('Agenda: não consegui ler ' + CHAVE + '; gravações bloqueadas nesta sessão.', e);
    return { estado: Nucleo.estadoInicial(), textoCorrompido: null, leituraFalhou: true };
  }
  const r = Nucleo.carregar(texto);
  if (r.corrompido) console.warn('Agenda: agenda.v1 ilegível; abrindo vazio. O texto original será guardado em ' + CHAVE_CORROMPIDO + ' antes da primeira gravação.');
  return { estado: r.estado, textoCorrompido: r.corrompido ? texto : null, leituraFalhou: false };
})();

let estado = boot.estado;
let textoCorrompido = boot.textoCorrompido; // texto ruim ainda não guardado à parte
let leituraFalhou = boot.leituraFalhou;     // agenda.v1 não pôde ser lido: nada é gravado por cima
let aba = ABAS.includes(lerArmazenado(CHAVE_ABA)) ? lerArmazenado(CHAVE_ABA) : 'linha';
let diaAtual = hojeIso();
let semanaInicio = null;    // domingo da semana visível (só na memória); null = semana de hoje
let mesIso = null;          // dia 1 do mês visível (só na memória); null = ainda não escolhido
let diaSel = null;          // dia selecionado no Mês
let forcarHoje = false;     // "Hoje": a próxima desenhada da Semana rola até a coluna de hoje

// Antes da primeira gravação, guarda o texto corrompido para nunca perdê-lo.
// Se a chave já guarda outro texto, usa uma chave com carimbo de tempo em vez de sobrescrever.
function guardarCorrompido() {
  if (textoCorrompido === null) return true;
  const atual = lerArmazenado(CHAVE_CORROMPIDO);
  const chave = !atual || atual === textoCorrompido ? CHAVE_CORROMPIDO : CHAVE_CORROMPIDO + '.' + Date.now();
  if (!gravarArmazenado(chave, textoCorrompido)) return false;
  textoCorrompido = null;
  return true;
}
function salvar() {
  if (leituraFalhou) {
    console.warn('Agenda: gravação bloqueada porque ' + CHAVE + ' não pôde ser lido.');
    return false;
  }
  if (!guardarCorrompido()) {
    console.warn('Agenda: gravação adiada para não apagar o agenda.v1 corrompido.');
    return false;
  }
  return gravarArmazenado(CHAVE, JSON.stringify(estado));
}

// ---- datas ----
function hojeIso() { return Nucleo.isoDia(new Date()); }
function horaAgora() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function nomeMes(iso) {
  const d = Nucleo.deIso(iso);
  const ano = d.getFullYear();
  return MESES_LONGOS[d.getMonth()] + (ano !== new Date().getFullYear() ? ' ' + ano : '');
}
function catDe(t) { return estado.cats.find((c) => c.id === t.cat) || null; }

// ---- elementos ----
function el(tag, classe, texto) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texto !== undefined) e.textContent = texto;
  return e;
}
const $corpo = document.getElementById('corpo');

// Marcadores depois do título: "📝" com anotação, "📷N" com fotos. O ícone é decorativo; o nome acessível ganha o texto.
function marcadoresTarefa(t) {
  const n = (t.fotos || []).length;
  const temNota = typeof t.nota === 'string' && t.nota !== '';
  const icones = (temNota ? '📝' : '') + (temNota && n ? ' ' : '') + (n ? '📷' + n : '');
  const falado = (temNota ? ', com anotação' : '') + (n ? ', ' + plural(n, 'foto', 'fotos') : '');
  if (!icones) return [];
  const mk = el('span', 'mk', icones);
  mk.setAttribute('aria-hidden', 'true');
  const leitor = el('span', 'so-leitor', falado);
  return [mk, leitor];
}
// Barra de tarefa (usada na Linha e no Mês): texto abre a folha, círculo marca feito.
function elTarefa(t) {
  const cat = catDe(t);
  const barra = el('div', 'task' + (t.feito ? ' feito' : ''));
  barra.dataset.id = t.id;
  barra.style.setProperty('--c', cat ? cat.cor : COR_SEM_CAT);

  const abrir = el('button', 'abrir');
  abrir.type = 'button';
  abrir.append(el('span', 't', t.hora || '—'));
  const ti = el('span', 'ti', t.titulo);
  ti.append(...marcadoresTarefa(t));
  if (cat) ti.append(el('small', '', cat.nome + (t.hora ? '' : ' · sem horário')));
  abrir.append(ti);
  abrir.addEventListener('click', () => abrirFolha(t));

  const ck = el('button', 'ck');
  ck.type = 'button';
  ck.setAttribute('aria-pressed', t.feito ? 'true' : 'false');
  ck.setAttribute('aria-label', t.feito ? 'Desmarcar como feita' : 'Marcar como feita');
  ck.append(el('i'));
  ck.addEventListener('click', () => alternarFeito(t.id));

  barra.append(abrir, ck);
  arrastarParaApagar(barra, t.id);
  return barra;
}

function alternarFeito(id) {
  const t = estado.tarefas.find((x) => x.id === id);
  if (!t) return;
  t.feito = !t.feito;
  avisarFalha(salvar());
  render();
}

// ---- aviso (toast) ----
// Um aviso por vez: um novo substitui o anterior, e a ação do anterior deixa de valer.
const $toast = document.getElementById('toast');
let toastAtual = null;
// aoExpirar: chamado quando o aviso some sem a ação ter sido tocada (tempo, outro aviso ou fecharToast).
function toast(msg, { acao, rotulo, ms = 4000, aoExpirar } = {}) {
  fecharToast();
  const meu = { aoExpirar };
  toastAtual = meu;
  $toast.replaceChildren(el('span', 'msg', msg));
  if (acao) {
    const sep = el('span', 'sep', '·');
    sep.setAttribute('aria-hidden', 'true');
    const bt = el('button', '', rotulo || 'OK');
    bt.type = 'button';
    bt.addEventListener('click', () => {
      if (toastAtual !== meu) return;
      meu.aoExpirar = null;
      fecharToast();
      acao();
    });
    $toast.append(sep, bt);
  }
  $toast.classList.add('visivel');
  meu.timer = setTimeout(() => { if (toastAtual === meu) fecharToast(); }, ms);
}
function fecharToast() {
  if (!toastAtual) return;
  const t = toastAtual;
  clearTimeout(t.timer);
  toastAtual = null;
  $toast.classList.remove('visivel');
  setTimeout(() => { if (!toastAtual) $toast.replaceChildren(); }, 250);
  if (t.aoExpirar) t.aoExpirar();
}
function avisarFalha(ok) {
  if (!ok) toast(MSG_FALHA);
  return ok;
}

// ---- apagar com desfazer ----
// Desfazer devolve o mesmo objeto (mesmo id). Um novo aviso torna definitivo o apagamento anterior.
function apagar(id) {
  const i = estado.tarefas.findIndex((t) => t.id === id);
  if (i < 0) return;
  const [t] = estado.tarefas.splice(i, 1);
  const ok = salvar();
  render();
  toast(ok ? 'Compromisso apagado' : MSG_FALHA, {
    rotulo: 'Desfazer',
    ms: 5000,
    // Definitivo (tempo, outro aviso, fechar): as fotos saem, menos as que algo vivo ainda referencia.
    aoExpirar: () => {
      if (!ok || !t.fotos || !t.fotos.length) return; // apagamento não gravado: a tarefa volta no próximo boot, com as fotos
      const vivas = new Set(idsFotosEmUso());
      apagarFotosSemEsperar(t.fotos.filter((f) => !vivas.has(f)));
    },
    acao: () => {
      if (estado.tarefas.some((x) => x.id === t.id)) return;
      estado.tarefas.splice(Math.min(i, estado.tarefas.length), 0, t);
      avisarFalha(salvar());
      render();
    },
  });
}

// Arrastar a barra para a esquerda além de 40% da largura apaga; menos que isso, ela volta.
// Com touch-action: pan-y a rolagem vertical continua com o navegador; só o gesto horizontal é nosso.
const LIMIAR_GESTO = 10;
function arrastarParaApagar(barra, id) {
  let pid = null, x0 = 0, y0 = 0, dx = 0, horizontal = false, arrastou = false;
  // Termina o gesto; só apaga num pointerup além de 40% da largura. Qualquer outro fim devolve a barra.
  const terminar = (apagarAgora) => {
    const era = horizontal;
    pid = null;
    horizontal = false;
    if (!era) return;
    setTimeout(() => { arrastou = false; }, 0); // o clique, se vier, chega antes disto
    barra.classList.remove('arrastando');
    if (apagarAgora && -dx > barra.offsetWidth * 0.4) {
      barra.style.transform = 'translateX(-110%)';
      barra.style.opacity = '0';
      setTimeout(() => apagar(id), 180);
    } else {
      barra.style.transform = '';
      barra.style.opacity = '';
    }
  };
  barra.addEventListener('pointerdown', (e) => {
    if (horizontal || (e.pointerType === 'mouse' && e.button !== 0)) return;
    // Um gesto anterior que não terminou aqui (soltou fora da barra) é descartado.
    pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; arrastou = false;
  });
  barra.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { terminar(false); return; } // botão solto fora daqui
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!horizontal) {
      if (Math.abs(mx) < LIMIAR_GESTO && Math.abs(my) < LIMIAR_GESTO) return;
      if (mx >= 0 || Math.abs(mx) <= Math.abs(my)) { pid = null; return; } // vertical ou para a direita: não é nosso
      try { barra.setPointerCapture(pid); } catch (err) { pid = null; return; }
      horizontal = arrastou = true;
      barra.classList.add('arrastando');
    }
    dx = Math.min(0, mx);
    barra.style.transform = 'translateX(' + dx + 'px)';
    barra.style.opacity = String(1 - Math.min(0.6, -dx / barra.offsetWidth));
  });
  const soltar = (e) => {
    if (e.pointerId === pid) terminar(e.type === 'pointerup');
  };
  // Antes de virar gesto horizontal não há captura: sair da barra encerra a tentativa.
  barra.addEventListener('pointerleave', (e) => { if (e.pointerId === pid && !horizontal) pid = null; });
  // Só a perda da captura da própria barra (a captura implícita do toque, num filho, também borbulha).
  barra.addEventListener('lostpointercapture', (e) => { if (e.target === barra) soltar(e); });
  barra.addEventListener('pointerup', soltar);
  barra.addEventListener('pointercancel', soltar);
  // O clique que o navegador gera depois de um arrasto não abre a folha nem marca feito.
  barra.addEventListener('click', (e) => {
    if (!arrastou) return;
    arrastou = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

function elFaixaDia(iso, n, ehHoje) {
  const faixa = el('div', 'day' + (ehHoje ? ' hoje' : ''));
  faixa.append(el('span', 'dnum', String(Nucleo.deIso(iso).getDate())));
  const lbl = el('span', 'dlbl', DIAS_LONGOS[Nucleo.deIso(iso).getDay()]);
  if (ehHoje) lbl.append(el('em', '', 'hoje'));
  faixa.append(lbl, el('span', 'cnt', String(n)));
  return faixa;
}

function elNovaNoDia(iso) {
  const dow = Nucleo.deIso(iso).getDay();
  const prep = dow === 0 || dow === 6 ? 'no' : 'na';
  const bt = el('button', 'gap', '+ tarefa ' + prep + ' ' + DIAS_LONGOS[dow].toLowerCase());
  bt.type = 'button';
  bt.addEventListener('click', () => abrirFolha({ data: iso }));
  return bt;
}

function elDia(item, hoje) {
  const sec = el('section', 'dia');
  sec.dataset.data = item.data;
  sec.append(elFaixaDia(item.data, item.tarefas.length, item.data === hoje));
  const lista = el('div', 'tarefas');
  item.tarefas.forEach((t) => lista.append(elTarefa(t)));
  sec.append(lista, elNovaNoDia(item.data));
  return sec;
}

// Traço "AGORA HH:MM" no dia de hoje, depois das tarefas sem hora e das que já passaram.
function atualizarAgora() {
  const lista = $corpo.querySelector('section.dia[data-data="' + diaAtual + '"] .tarefas');
  if (!lista) return;
  lista.querySelectorAll('.agora').forEach((x) => x.remove());
  const hhmm = horaAgora();
  const doDia = Nucleo.ordenarDia(estado.tarefas.filter((t) => t.data === diaAtual));
  let i = 0;
  while (i < doDia.length && (!doDia[i].hora || doDia[i].hora <= hhmm)) i++;
  lista.insertBefore(el('div', 'agora', 'AGORA ' + hhmm), lista.children[i] || null);
}

// Espaço no fim para que a faixa de hoje sempre possa subir até o topo.
function ajustarFim() {
  const fim = $corpo.querySelector('.fim');
  const sec = $corpo.querySelector('section.dia[data-data="' + diaAtual + '"]');
  if (!fim || !sec) return;
  fim.style.height = '0px';
  const falta = $corpo.clientHeight - ($corpo.scrollHeight - sec.offsetTop);
  fim.style.height = Math.max(0, falta) + 'px';
}

// ---- visualizações ----
function renderLinha() {
  const y = $corpo.scrollTop;
  const frag = document.createDocumentFragment();
  for (const item of Nucleo.montarLinha(estado.tarefas, diaAtual)) {
    frag.append(item.tipo === 'dia' ? elDia(item, diaAtual) : el('div', 'vazio', Nucleo.rotuloLivres(item.de, item.ate, item.n)));
  }
  frag.append(el('div', 'fim'));
  $corpo.replaceChildren(frag);
  atualizarAgora();
  ajustarFim();
  $corpo.scrollTop = y;
}
function elMini(t) {
  const cat = catDe(t);
  const b = el('button', 'mini' + (t.feito ? ' feito' : ''));
  b.type = 'button';
  b.dataset.id = t.id;
  b.style.setProperty('--c', cat ? cat.cor : COR_SEM_CAT);
  const lin = el('span', 'lin');
  lin.append(el('span', 'ti', t.titulo), ...marcadoresTarefa(t));
  b.append(el('span', 't', t.hora || '—'), lin);
  b.addEventListener('click', () => abrirFolha(t));
  return b;
}
function elColuna(dia, hoje) {
  const col = el('div', 'col' + (dia.data === hoje ? ' hoje' : dia.data < hoje ? ' passado' : ''));
  col.dataset.data = dia.data;
  const d = Nucleo.deIso(dia.data);
  const topo = el('div', 'colh');
  topo.append(el('small', '', DIAS_CURTOS[d.getDay()]), el('span', '', String(d.getDate())));
  col.append(topo);
  dia.tarefas.forEach((t) => col.append(elMini(t)));
  const mais = el('button', 'livre', '+');
  mais.type = 'button';
  mais.dataset.data = dia.data;
  mais.setAttribute('aria-label', 'Novo compromisso em ' + rotuloDiaCurto(dia.data));
  mais.addEventListener('click', () => abrirFolha({ data: dia.data }));
  col.append(mais);
  return col;
}
function mesCurto(iso) { return MESES_LONGOS[Nucleo.deIso(iso).getMonth()].slice(0, 3).toLowerCase(); }
// "15 – 21 nov", "29 nov – 5 dez"; o ano entra na data final só se não for o ano corrente.
function tituloSemana(inicio) {
  const fim = Nucleo.somaDias(inicio, 6);
  const a = Nucleo.deIso(inicio), b = Nucleo.deIso(fim);
  const ano = b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : '';
  const ini = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear() ? String(a.getDate()) : a.getDate() + ' ' + mesCurto(inicio);
  return ini + ' – ' + b.getDate() + ' ' + mesCurto(fim) + ano;
}
function rotuloContagem(n) { return n === 0 ? 'Nenhum compromisso' : n === 1 ? '1 compromisso' : n + ' compromissos'; }
function mudarSemana(n) {
  semanaInicio = Nucleo.somaDias(semanaInicio, 7 * n);
  $corpo.scrollTop = 0;
  render();
}
function renderSemana() {
  if (semanaInicio === null) semanaInicio = Nucleo.inicioSemana(diaAtual);
  // Mesma semana já na tela (ex.: depois de salvar): mantém as rolagens.
  const antes = $corpo.querySelector('.week');
  const manter = antes && antes.dataset.inicio === semanaInicio && !forcarHoje;
  forcarHoje = false;
  const x = manter ? antes.scrollLeft : 0, y = manter ? $corpo.scrollTop : 0;

  const dias = Nucleo.semana(estado.tarefas, semanaInicio);
  const total = dias.reduce((n, d) => n + d.tarefas.length, 0);
  const barra = el('div', 'wkbar');
  const ant = el('button', '', '‹ anterior');
  ant.type = 'button';
  ant.setAttribute('aria-label', 'Semana anterior');
  ant.addEventListener('click', () => mudarSemana(-1));
  const prox = el('button', '', 'próxima ›');
  prox.type = 'button';
  prox.setAttribute('aria-label', 'Próxima semana');
  prox.addEventListener('click', () => mudarSemana(1));
  barra.append(ant, el('b', '', rotuloContagem(total)), prox);

  const semanaEl = el('div', 'week');
  semanaEl.dataset.inicio = semanaInicio;
  dias.forEach((d) => semanaEl.append(elColuna(d, diaAtual)));
  $corpo.replaceChildren(barra, semanaEl);

  if (manter) {
    semanaEl.scrollLeft = x;
    $corpo.scrollTop = y;
  } else {
    const hojeCol = semanaEl.querySelector('.col.hoje');
    if (hojeCol) semanaEl.scrollLeft += hojeCol.getBoundingClientRect().left - semanaEl.getBoundingClientRect().left - 12;
  }
}
function primeiroDoMes(iso) {
  const d = Nucleo.deIso(iso);
  return Nucleo.isoDia(new Date(d.getFullYear(), d.getMonth(), 1));
}
// Vai para o mês de `primeiro`; seleciona `dia`, ou hoje se for o mês atual, ou o dia 1.
function irParaMes(primeiro, dia) {
  mesIso = primeiro;
  diaSel = dia || (primeiro === primeiroDoMes(diaAtual) ? diaAtual : primeiro);
  $corpo.scrollTop = 0;
  render();
}
function mudarMes(n) {
  const d = Nucleo.deIso(mesIso);
  irParaMes(Nucleo.isoDia(new Date(d.getFullYear(), d.getMonth() + n, 1)));
}
function selecionarDia(iso) {
  if (primeiroDoMes(iso) !== mesIso) { irParaMes(primeiroDoMes(iso), iso); return; }
  diaSel = iso;
  render();
}
function rotuloCelula(iso, n) {
  const d = Nucleo.deIso(iso);
  return d.getDate() + ' de ' + MESES_LONGOS[d.getMonth()].toLowerCase() + ', ' + rotuloContagem(n).toLowerCase();
}
function elCelula(c, hoje) {
  const n = estado.tarefas.filter((t) => t.data === c.data).length;
  const cls = ['cell'];
  if (c.data === hoje) cls.push('hoje');
  else if (!c.doMes) cls.push('out');
  else if (c.data < hoje) cls.push('passado');
  if (c.data === diaSel) cls.push('sel');
  const b = el('button', cls.join(' '));
  b.type = 'button';
  b.dataset.data = c.data;
  b.setAttribute('aria-label', rotuloCelula(c.data, n));
  b.setAttribute('aria-pressed', c.data === diaSel ? 'true' : 'false');
  if (c.data === hoje) b.setAttribute('aria-current', 'date');
  b.append(el('span', '', String(Nucleo.deIso(c.data).getDate())));
  const p = Nucleo.pontosDia(estado.tarefas, c.data, estado.cats);
  if (p.cores.length) {
    const pts = el('span', 'pts');
    pts.setAttribute('aria-hidden', 'true');
    p.cores.forEach((cor) => { const i = el('i'); i.style.setProperty('--c', cor); pts.append(i); });
    if (p.mais) pts.append(el('b', '', '+'));
    b.append(pts);
  }
  b.addEventListener('click', () => selecionarDia(c.data));
  return b;
}
// Arrastar a grade na horizontal (>60px) troca de mês; a vertical fica com o navegador (touch-action: pan-y).
function arrastarMes(grade) {
  let pid = null, x0 = 0, y0 = 0, horizontal = false, arrastou = false;
  grade.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; horizontal = arrastou = false;
  });
  grade.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid || horizontal) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (Math.abs(mx) < LIMIAR_GESTO && Math.abs(my) < LIMIAR_GESTO) return;
    if (Math.abs(mx) > Math.abs(my)) horizontal = arrastou = true; else pid = null;
  });
  grade.addEventListener('pointerup', (e) => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - x0, era = horizontal;
    pid = null; horizontal = false;
    if (!era) return;
    setTimeout(() => { arrastou = false; }, 0); // o clique, se vier, chega antes disto
    if (Math.abs(dx) > 60) mudarMes(dx < 0 ? 1 : -1);
  });
  grade.addEventListener('pointercancel', (e) => { if (e.pointerId === pid) { pid = null; horizontal = false; } });
  // O clique que o navegador gera depois de um arrasto não seleciona o dia.
  grade.addEventListener('click', (e) => {
    if (!arrastou) return;
    arrastou = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
}
function elListaDia(iso) {
  const sec = el('section', 'mlist');
  sec.dataset.data = iso;
  sec.append(el('h4', '', DIAS_LONGOS[Nucleo.deIso(iso).getDay()] + ', ' + Nucleo.deIso(iso).getDate()));
  const doDia = Nucleo.ordenarDia(estado.tarefas.filter((t) => t.data === iso));
  if (!doDia.length) sec.append(el('p', 'nada', 'Nada marcado neste dia'));
  const lista = el('div', 'tarefas');
  doDia.forEach((t) => lista.append(elTarefa(t)));
  sec.append(lista, elNovaNoDia(iso));
  return sec;
}
function renderMes() {
  if (mesIso === null) { mesIso = primeiroDoMes(diaAtual); diaSel = diaAtual; }
  const antes = $corpo.querySelector('.grid');
  const y = antes && antes.dataset.mes === mesIso ? $corpo.scrollTop : 0;
  const d = Nucleo.deIso(mesIso);
  const celulas = Nucleo.gradeMes(d.getFullYear(), d.getMonth());
  const total = estado.tarefas.filter((t) => primeiroDoMes(t.data) === mesIso).length;

  const barra = el('div', 'wkbar');
  const ant = el('button', 'seta', '‹');
  ant.type = 'button';
  ant.setAttribute('aria-label', 'Mês anterior');
  ant.addEventListener('click', () => mudarMes(-1));
  const prox = el('button', 'seta', '›');
  prox.type = 'button';
  prox.setAttribute('aria-label', 'Próximo mês');
  prox.addEventListener('click', () => mudarMes(1));
  barra.append(ant, el('b', '', rotuloContagem(total)), prox);

  const grade = el('div', 'grid');
  grade.dataset.mes = mesIso;
  DIAS_CURTOS.forEach((n) => {
    const w = el('div', 'wd', n[0]);
    w.setAttribute('aria-hidden', 'true');
    grade.append(w);
  });
  celulas.forEach((c) => grade.append(elCelula(c, diaAtual)));
  arrastarMes(grade);
  $corpo.replaceChildren(barra, grade, elListaDia(diaSel));
  $corpo.scrollTop = y;
}

function atualizarCabecalho() {
  document.getElementById('rotulo-aba').textContent = ROTULO_ABA[aba];
  if (aba === 'semana') {
    document.getElementById('rotulo-mes').textContent = tituloSemana(semanaInicio === null ? Nucleo.inicioSemana(diaAtual) : semanaInicio);
    return;
  }
  if (aba === 'mes') {
    const m = Nucleo.deIso(mesIso === null ? diaAtual : mesIso);
    document.getElementById('rotulo-mes').textContent = MESES_LONGOS[m.getMonth()] + ' ' + m.getFullYear();
    return;
  }
  document.getElementById('rotulo-mes').textContent = nomeMes(diaNoTopo());
}
// Data da faixa de dia mais próxima do topo da rolagem (a última que já passou do topo).
function diaNoTopo() {
  const topo = $corpo.scrollTop + 8;
  let iso = null;
  for (const sec of $corpo.querySelectorAll('section.dia')) {
    if (iso !== null && sec.offsetTop > topo) break;
    iso = sec.dataset.data;
  }
  return iso || diaAtual;
}

function render() {
  diaAtual = hojeIso();
  document.querySelectorAll('.tabs button').forEach((b) => {
    if (b.dataset.aba === aba) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (aba === 'linha') renderLinha();
  else if (aba === 'semana') renderSemana();
  else renderMes();
  atualizarCabecalho();
}

// ---- navegação ----
function irParaHoje(suave) {
  if (aba === 'semana') { semanaInicio = null; forcarHoje = true; } // volta à semana de hoje, com a coluna de hoje à vista
  if (aba === 'mes') { mesIso = null; diaSel = null; }               // volta ao mês atual com hoje selecionado

// ---- folha de novo/editar ----

// { id, data, hora, cat, avulsa, urls, preparando, salvando, gravando, toastFoto } enquanto a folha de compromisso
// está aberta. Cada abertura é um objeto novo: código assíncrono confere `folha === minha` antes de mexer.
let folha = null;
// Fotos da folha aberta, na ordem: { id, blob, url, nova }. Nada vai para o IndexedDB antes do Salvar.

let quemAbriu = null;       // para devolver o foco ao fechar
let viradaPendente = false; // a meia-noite passou com a folha aberta

function rotuloDiaCurto(iso) {
  const d = Nucleo.deIso(iso);
  return DIAS_CURTOS[d.getDay()] + ' ' + d.getDate();
}
function rotuloDataAvulsa(iso) {
  const d = Nucleo.deIso(iso);
  const ano = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return rotuloDiaCurto(iso) + ' ' + MESES_LONGOS[d.getMonth()].slice(0, 3).toLowerCase() + ano;
}
function elChip(rotulo, ligado, aoTocar) {
  const b = el('button', 'chip', rotulo);
  b.type = 'button';
  b.setAttribute('aria-pressed', ligado ? 'true' : 'false');
  b.addEventListener('click', aoTocar);

}

// Hoje, Amanhã, os 3 dias seguintes e, se a data da tarefa (ou a escolhida em "outra data")
// não for nenhum deles, um chip com ela.
function desenharDias() {
  const hoje = hojeIso();
  const opcoes = [0, 1, 2, 3, 4].map((n) => {
    const iso = Nucleo.somaDias(hoje, n);
    return { iso, rotulo: n === 0 ? 'Hoje' : n === 1 ? 'Amanhã' : rotuloDiaCurto(iso) };
  });
  if (folha.avulsa && !opcoes.some((o) => o.iso === folha.avulsa)) {
    opcoes.push({ iso: folha.avulsa, rotulo: rotuloDataAvulsa(folha.avulsa) });
  }
  const focado = $dias.contains(document.activeElement) ? document.activeElement.dataset.iso : undefined;
  $dias.querySelectorAll('.chip-dia').forEach((b) => b.remove());
  for (const o of opcoes) {
    const b = elChip(o.rotulo, o.iso === folha.data, () => { folha.data = o.iso; desenharDias(); });
    b.classList.add('chip-dia');
    b.dataset.iso = o.iso;
    $outra.before(b);
    if (o.iso === focado) b.focus();
  }
}
function desenharHora() {

  $hora.classList.toggle('on', !!folha.hora);

// ---- anotação ----
const TEM_FIELD_SIZING = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('field-sizing', 'content');
function atualizarNota() {

// ---- fotos da folha ----
function urlDaFolha(minha, blob) {
  const url = URL.createObjectURL(blob);
  minha.urls.add(url);
  return url;
}
// Libera a URL de uma foto que saiu da folha (o Desfazer dela expirou).
function revogarFoto(foto) {
  if (!foto.url || fotosFolha.includes(foto)) return;
  URL.revokeObjectURL(foto.url);
  if (folha) folha.urls.delete(foto.url);
  foto.url = null;
}
// Ids que uma importação em andamento vai usar: nenhum apagamento pendente pode levá-los.
let fotosImportacao = [];
function apagarFotosSemEsperar(ids) {
  if (ids.length) Fotos.apagar(ids).catch((e) => console.warn('Agenda: não consegui apagar fotos', e));
}
// Ids que a limpeza de órfãs nunca apaga: os do estado e os da folha aberta (inclusive os sendo gravados).
function idsFotosEmUso() {
  const ids = Nucleo.idsFotos(estado.tarefas);
  ids.push(...fotosImportacao);
  if (folha) {
    fotosFolha.forEach((f) => ids.push(f.id));
    if (folha.gravando) ids.push(...folha.gravando);
  }
  return ids;
}

// Redesenha só as miniaturas; o botão e o "Preparando foto…" ficam no lugar (tirar do DOM perderia o foco).
function desenharFotos() {
  if (!folha) return;
  const n = fotosFolha.length;
  const antigas = [...$fotos.querySelectorAll('.foto')];
  const focoEm = antigas.indexOf(document.activeElement);
  const focoNoBotao = document.activeElement === $btFoto;
  const miniaturas = fotosFolha.map((foto, i) => {
    const b = el('button', 'foto');
    b.type = 'button';
    b.setAttribute('aria-label', 'Foto ' + (i + 1) + ' de ' + n);
    if (foto.url) {
      const img = el('img');
      img.alt = '';
      img.decoding = 'async';
      img.src = foto.url;
      b.append(img);
    }
    b.addEventListener('click', () => abrirVisualizador(i));
    return b;
  });
  // Ordem importa: o foco muda antes de o elemento focado sair ou sumir, senão o Chrome o solta no body.
  $btFoto.before(...miniaturas);
  const cheio = n >= Nucleo.LIMITE_FOTOS;
  const esconderBotao = cheio || !!folha.preparando;
  const lugarDoBotao = () => miniaturas[n - 1] || $titulo; // para onde vai o foco com o botão escondido
  if (focoEm >= 0) {
    (miniaturas[Math.min(focoEm, n - 1)] || (esconderBotao ? $titulo : $btFoto)).focus({ preventScroll: true });
  } else if (focoNoBotao && esconderBotao) {
    lugarDoBotao().focus({ preventScroll: true });
    if (folha.preparando) folha.focoVoltaAoBotao = true; // ao terminar de preparar, volta ao botão
  }
  antigas.forEach((b) => b.remove());
  $btFoto.hidden = esconderBotao;
  $btFoto.disabled = !!folha.salvando;
  $preparando.hidden = !folha.preparando;
  $fotosLimite.hidden = !cheio;
  if (!folha.preparando && folha.focoVoltaAoBotao) {
    folha.focoVoltaAoBotao = false;
    const a = document.activeElement;
    const ondeDeixamos = a === document.body || a === $titulo || (a && a.classList.contains('foto') && $fotos.contains(a));
    if (ondeDeixamos) ($btFoto.hidden ? lugarDoBotao() : $btFoto).focus({ preventScroll: true });
  }
  atualizarVisor(); // a lista mudou (removida, desfeita, carregada): o visualizador acompanha
}

// Fotos já guardadas: lê do IndexedDB na ordem. Id que não existe mais sai da folha sem quebrar.
async function carregarFotosFolha(minha, itens) {
  let falhou = false;
  for (const foto of itens) {
    let blob;
    try { blob = await Fotos.ler(foto.id); } catch (e) { console.warn('Agenda: não consegui ler a foto ' + foto.id, e); falhou = true; continue; }
    if (folha !== minha) return;
    if (!blob) {
      const i = fotosFolha.indexOf(foto);
      if (i >= 0) fotosFolha.splice(i, 1);
    } else {
      foto.blob = blob;
      foto.url = urlDaFolha(minha, blob);
    }
    desenharFotos();
  }
  if (falhou && folha === minha) avisarFotos();
}

// Escolha de fotos: reduz uma por vez; só entram as que cabem.
async function adicionarFotos(arquivos) {
  const minha = folha;
  if (!minha || minha.preparando || minha.salvando || !arquivos.length) return;
  const cabem = Nucleo.LIMITE_FOTOS - fotosFolha.length;
  if (cabem <= 0) return;
  if (arquivos.length > cabem) {
    arquivos = arquivos.slice(0, cabem);
    toast(cabem === 1 ? 'Só cabe mais 1 foto' : 'Só cabem mais ' + cabem + ' fotos');
  }
  minha.preparando = true;
  desenharFotos();
  atualizarSalvar();
  let formatoRuim = false;
  try {
    for (const arq of arquivos) {
      let blob;
      try { blob = await Fotos.reduzir(arq); } catch (e) { console.warn('Agenda: foto não lida', e); formatoRuim = true; continue; }
      if (folha !== minha) return;
      if (fotosFolha.length >= Nucleo.LIMITE_FOTOS) break; // um Desfazer ocupou a vaga
      fotosFolha.push({ id: Fotos.novoId(), blob, url: urlDaFolha(minha, blob), nova: true });
      desenharFotos();
    }
  } finally {
    if (folha === minha) {
      minha.preparando = false;
      desenharFotos();
      atualizarSalvar();
    }
  }
  if (formatoRuim && folha === minha) toast('Formato de foto não suportado');
}

// Tira a foto da folha (vale ao salvar), com Desfazer na mesma posição.
function removerFotoDaFolha(indice) {
  const minha = folha;
  if (!minha || minha.salvando || !fotosFolha[indice]) return;
  const [foto] = fotosFolha.splice(indice, 1);
  desenharFotos();
  toast('Foto removida', {
    rotulo: 'Desfazer',
    ms: 5000,
    acao: () => {
      if (folha !== minha || minha.salvando || fotosFolha.includes(foto)) { revogarFoto(foto); return; }
      if (fotosFolha.length >= Nucleo.LIMITE_FOTOS) { revogarFoto(foto); toast(TEXTO_LIMITE_FOTOS); return; }
      fotosFolha.splice(Math.min(indice, fotosFolha.length), 0, foto);
      desenharFotos();
    },
    aoExpirar: () => revogarFoto(foto),
  });
  minha.toastFoto = toastAtual;
}

// ---- visualizador de fotos (tela cheia, acima da folha) ----
// Mostra as fotos da folha aberta. Segue a foto pelo objeto (não pelo índice), porque a lista pode
// mudar com ele aberto (Remover, Desfazer, foto que terminou de carregar ou sumiu do banco).
const $visor = document.getElementById('visor');
const $visorPalco = document.getElementById('visor-palco');
const $visorImg = document.getElementById('visor-img');
const $visorCont = document.getElementById('visor-cont');
const $visorFechar = document.getElementById('visor-fechar');
const $visorRemover = document.getElementById('visor-remover');
const ZOOM_MAX = 4;
const ZOOM_DUPLO = 2.5;
const LIMIAR_TROCA = 60;   // px de arrasto lateral, sem zoom, para trocar de foto
const TOQUE_DUPLO_MS = 300;
// { foto, indice, mostrada, url, s (escala), tx, ty (deslocamento), puxa (arrasto lateral) } com ele aberto
let visor = null;
const toques = new Map(); // pointerId → { x, y } dos dedos no palco
let gesto = null;         // gesto em andamento: { modo: 'pinca' | 'pan' | '?' | 'lado' | 'nada', ... }
let ultimoToque = null;   // { t, x, y } do último toque simples, para o toque duplo
const reduzirMovimento = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function abrirVisualizador(indice) {
  if (!folha || visor || painel !== $folha || !fotosFolha[indice]) return;
  visor = { foto: fotosFolha[indice], indice, mostrada: null, url: null, s: 1, tx: 0, ty: 0, puxa: 0 };
  toques.clear();
  gesto = ultimoToque = null;
  $folha.inert = true; // o foco fica no visualizador (o #app já está inerte)
  $visor.hidden = false;
  mostrarFoto();
  empilharVisor();
  $visorFechar.focus();
}

// desfazerEntrada: fechou pela interface (Fechar, Esc, Remover a última), então desfaz a entrada no histórico.
// Pelo Voltar a entrada já foi consumida; fechando a folha, ela leva a entrada do visualizador junto.
function fecharVisor(desfazerEntrada, devolverFoco) {
  if (!visor) return;
  const v = visor;
  visor = null;
  toques.clear();
  gesto = ultimoToque = null;
  if (desfazerEntrada) desempilharVisor();
  $visor.hidden = true;
  $visorImg.classList.remove('anima');
  $visorImg.style.transform = '';
  $visorImg.removeAttribute('src'); // a URL é da folha: ela revoga ao fechar
  $visorCont.textContent = '';
  $folha.inert = false;
  if (!devolverFoco || !folha) return;
  // Volta à miniatura da foto que estava na tela; se ela saiu, à vizinha; sem fotos, ao botão ou ao título.
  const minis = $fotos.querySelectorAll('.foto');
  const i = fotosFolha.indexOf(v.foto);
  const alvo = minis[i >= 0 ? i : Math.min(v.indice, minis.length - 1)] || (!$btFoto.hidden && !$btFoto.disabled ? $btFoto : $titulo);
  alvo.focus({ preventScroll: true });
}

// A lista da folha mudou: a foto da tela saiu → a que ficou no lugar dela (ou a anterior, se era a última);
// nenhuma sobrou → fecha.
function atualizarVisor() {
  if (!visor) return;
  const n = fotosFolha.length;
  if (!n) { fecharVisor(true, true); return; }
  let i = fotosFolha.indexOf(visor.foto);
  if (i < 0) {
    i = Math.min(visor.indice, n - 1);
    visor.foto = fotosFolha[i];
  }
  visor.indice = i;
  mostrarFoto();
}

function mostrarFoto() {
  const foto = visor.foto;
  if (visor.mostrada !== foto) { // outra foto: zera zoom e arrasto
    visor.mostrada = foto;
    visor.s = 1; visor.tx = visor.ty = visor.puxa = 0;
    gesto = ultimoToque = null;
    aplicarTransform(false);
  }
  if (visor.url !== foto.url) { // a foto ainda carregando do banco ganha a URL depois
    visor.url = foto.url;
    if (foto.url) $visorImg.src = foto.url; else $visorImg.removeAttribute('src');
  }
  const txt = (visor.indice + 1) + ' / ' + fotosFolha.length;
  if ($visorCont.textContent !== txt) $visorCont.textContent = txt;
}

function aplicarTransform(animar) {
  $visorImg.classList.toggle('anima', !!animar);
  $visorImg.style.transform = 'translate(' + (visor.tx + visor.puxa) + 'px,' + visor.ty + 'px) scale(' + visor.s + ')';
}
function centroPalco() {
  const r = $visorPalco.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
// Com zoom, a foto pode andar só até a borda dela encostar na da tela; menor que a tela, fica centrada.
function limitarDeslocamento() {
  const W = $visorPalco.clientWidth, H = $visorPalco.clientHeight;
  const iw = $visorImg.naturalWidth || W, ih = $visorImg.naturalHeight || H;
  const k = Math.min(W / iw, H / ih); // object-fit: contain
  const mx = Math.max(0, (iw * k * visor.s - W) / 2), my = Math.max(0, (ih * k * visor.s - H) / 2);
  visor.tx = Math.min(mx, Math.max(-mx, visor.tx));
  visor.ty = Math.min(my, Math.max(-my, visor.ty));
}
// Escala `s` mantendo parado o ponto (px, py) da tela, relativo ao centro do palco.
function zoomEm(s, px, py) {
  s = Math.min(ZOOM_MAX, Math.max(1, s));
  visor.tx = px - s * (px - visor.tx) / visor.s;
  visor.ty = py - s * (py - visor.ty) / visor.s;
  visor.s = s;
  limitarDeslocamento();
}

// Próxima (+1) ou anterior (−1), sem dar a volta. A nova entra deslizando do lado de onde veio.
function trocarFoto(delta) {
  if (!visor) return false;
  const j = visor.indice + delta;
  if (j < 0 || j >= fotosFolha.length) return false;
  visor.foto = fotosFolha[j];
  visor.indice = j;
  mostrarFoto();
  if (!reduzirMovimento()) {
    visor.puxa = delta * $visorPalco.clientWidth * 0.35;
    aplicarTransform(false);
    void $visorImg.offsetWidth; // fixa a posição de partida antes da transição
    visor.puxa = 0;
    aplicarTransform(true);
  }
  return true;
}

// Gestos (Pointer Events; touch-action:none só nesta camada): pinça 1×–4× em torno do meio dos dedos;
// um dedo com zoom move a foto; sem zoom, arrasto lateral > 60px troca de foto; toque duplo 1× ↔ 2,5×.
function iniciarGesto(continuacao) {
  const pts = [...toques.values()];
  $visorImg.classList.remove('anima');
  if (pts.length >= 2) {
    const [a, b] = pts, c = centroPalco();
    visor.puxa = 0;
    gesto = { modo: 'pinca', d0: Math.hypot(b.x - a.x, b.y - a.y) || 1, mx0: (a.x + b.x) / 2 - c.x, my0: (a.y + b.y) / 2 - c.y,
      s0: visor.s, tx0: visor.tx, ty0: visor.ty };
    aplicarTransform(false);
  } else if (pts.length === 1) {
    const p = pts[0];
    // Sobrou um dedo depois da pinça: continua movendo (com zoom) sem virar troca de foto nem toque.
    gesto = { modo: visor.s > 1 ? 'pan' : continuacao ? 'nada' : '?', x0: p.x, y0: p.y, tx0: visor.tx, ty0: visor.ty, toque: !continuacao };
  } else {
    gesto = null;
  }

$visorPalco.addEventListener('pointerdown', (e) => {
  if (!visor || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { $visorPalco.setPointerCapture(e.pointerId); } catch (err) { /* segue sem captura */ }
  const continuacao = toques.size > 0;
  toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
  iniciarGesto(continuacao);
});
$visorPalco.addEventListener('pointermove', (e) => {
  if (!visor || !gesto || !toques.has(e.pointerId)) return;
  toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesto.modo === 'pinca') {
    const [a, b] = [...toques.values()], c = centroPalco();
    const s = Math.min(ZOOM_MAX, Math.max(1, gesto.s0 * Math.hypot(b.x - a.x, b.y - a.y) / gesto.d0));
    // o ponto da foto que estava sob o meio dos dedos acompanha o meio dos dedos
    visor.tx = (a.x + b.x) / 2 - c.x - s * (gesto.mx0 - gesto.tx0) / gesto.s0;
    visor.ty = (a.y + b.y) / 2 - c.y - s * (gesto.my0 - gesto.ty0) / gesto.s0;
    visor.s = s;
    limitarDeslocamento();
    aplicarTransform(false);
    return;
  }
  const dx = e.clientX - gesto.x0, dy = e.clientY - gesto.y0;
  if (gesto.toque && Math.hypot(dx, dy) > LIMIAR_GESTO) gesto.toque = false;
  if (gesto.modo === 'pan') {
    visor.tx = gesto.tx0 + dx;
    visor.ty = gesto.ty0 + dy;
    limitarDeslocamento();
    aplicarTransform(false);
    return;
  }
  if (gesto.modo === '?') {
    if (Math.abs(dx) < LIMIAR_GESTO && Math.abs(dy) < LIMIAR_GESTO) return;
    gesto.modo = Math.abs(dx) > Math.abs(dy) ? 'lado' : 'nada';
  }
  if (gesto.modo === 'lado') {
    const temVizinha = dx < 0 ? visor.indice < fotosFolha.length - 1 : visor.indice > 0;
    visor.puxa = temVizinha ? dx : dx * 0.3; // na ponta, só um pouco de elástico
    aplicarTransform(false);
  }
});
function soltarToque(e) {
  if (!toques.has(e.pointerId)) return;
  const fim = gesto;
  toques.delete(e.pointerId);
  if (!visor || !fim) { if (!toques.size) gesto = null; return; }
  if (toques.size) { iniciarGesto(true); return; } // ainda há dedo na tela
  gesto = null;
  if (fim.modo === 'pinca') {
    if (visor.s < 1.05) { visor.s = 1; visor.tx = visor.ty = 0; aplicarTransform(true); }
    return;
  }
  if (fim.modo === 'lado') {
    const dx = e.clientX - fim.x0;
    if (e.type === 'pointerup' && Math.abs(dx) > LIMIAR_TROCA && trocarFoto(dx < 0 ? 1 : -1)) return;
    visor.puxa = 0;
    aplicarTransform(true); // não trocou: volta ao lugar
    return;
  }
  if (fim.toque && e.type === 'pointerup') tocouFoto(e.clientX, e.clientY);
}
function tocouFoto(x, y) {
  const agora = performance.now(), u = ultimoToque;
  if (u && agora - u.t < TOQUE_DUPLO_MS && Math.hypot(x - u.x, y - u.y) < 40) {
    ultimoToque = null;
    if (visor.s > 1) { visor.s = 1; visor.tx = visor.ty = 0; }
    else { const c = centroPalco(); zoomEm(ZOOM_DUPLO, x - c.x, y - c.y); }
    aplicarTransform(true);
    return;
  }
  ultimoToque = { t: agora, x, y };
}
$visorPalco.addEventListener('pointerup', soltarToque);

function teclaNoVisor(e) {

}

// Fechou a folha (qualquer caminho): fotos pendentes ficam só na memória e somem; URLs são revogadas.
