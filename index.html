// ---- Voltar do Android ----
// Cada folha aberta empilha uma entrada no histórico: o Voltar (botão ou gesto) fecha a folha
// em vez de sair do app. Fechada pela interface, a entrada é desfeita com history.go(-n).
// O visualizador de fotos empilha mais uma, acima da da folha: o Voltar fecha primeiro só ele.
let entradaPainel = false;  // a folha aberta tem uma entrada nossa no histórico
let entradaVisor = false;   // o visualizador aberto tem uma entrada nossa, acima da da folha
let voltando = false;       // history.go() nosso cujo popstate ainda não chegou
let voltarMais = 0;         // entradas a desfazer quando esse popstate chegar
function empilharHistorico(estadoHist) {
  try {
    history.pushState(estadoHist, '');
    return true;
  } catch (e) { console.warn('Agenda: não consegui empilhar o histórico', e); return false; }
}
// Abriu logo depois de fechar: o popstate do back pendente empilha.
function empilharPainel() { if (!voltando) entradaPainel = empilharHistorico({ painel: 1 }); }
function empilharVisor() { if (!voltando) entradaVisor = empilharHistorico({ visor: 1 }); }
function voltarHistorico(n) {
  if (n <= 0) return;
  if (voltando) { voltarMais += n; return; } // um back nosso ainda em curso: este vai depois dele
  voltando = true;
  history.go(-n);
}
// Fechar a folha desfaz também a entrada do visualizador, se ele estava aberto.
function desempilharPainel() {
  const n = (entradaPainel ? 1 : 0) + (entradaVisor ? 1 : 0);
  entradaPainel = entradaVisor = false;
  voltarHistorico(n);
}
function desempilharVisor() {
  if (!entradaVisor) return;
  entradaVisor = false;
  voltarHistorico(1);
}
addEventListener('popstate', () => {
  if (voltando) { // é o nosso history.go()
    voltando = false;
    if (voltarMais) { const n = voltarMais; voltarMais = 0; voltarHistorico(n); return; }
    if (painel && !entradaPainel) empilharPainel();
    if (visor && !entradaVisor) empilharVisor();
    return;
  }
  if (visor) { // primeiro só o visualizador; a folha continua aberta
    if (entradaVisor) entradaVisor = false;
    else { entradaPainel = false; empilharPainel(); } // sem entrada própria, o Voltar levou a da folha
    fecharVisor(false, true);
    return;
  }
  if (!painel) return;
  entradaPainel = false; // o Voltar já consumiu a nossa entrada
  if (painel === $ajustes && fecharConfirmacao()) { empilharPainel(); return; } // primeiro só a confirmação
  fecharPainel();
});

// Ciclo de vida comum às folhas: foco, #app inerte, véu, devolução do foco, histórico e virada do dia adiada.
function abrirPainel(elFolha, origem, foco) {
  painel = elFolha;
  quemAbriu = { el: document.activeElement, id: origem.id, data: origem.data };
  elFolha.style.transform = '';
  $app.inert = true;
  $veu.classList.add('aberta');
  elFolha.classList.add('aberta');
  empilharPainel();
  foco.focus();
}

function fecharPainel() {
  if (!painel) return;
  fecharVisor(false, false); // a entrada dele sai junto com a da folha
  desempilharPainel();
  descartarFolha();
  folha = null;
  painel.classList.remove('aberta', 'arrastando');
  painel.style.transform = '';
  painel = null;
  $veu.classList.remove('aberta');
  $app.inert = false;
  if (viradaPendente) {
    viradaPendente = false;
    virar();
  }
  devolverFoco();
}
// Volta ao elemento que abriu a folha; se ele foi redesenhado, à barra da tarefa ou ao "+ tarefa" do dia.
function devolverFoco() {
  const q = quemAbriu;
  quemAbriu = null;
  let alvo = q && q.el && q.el !== document.body && q.el.isConnected ? q.el : null;
  if (!alvo && q && q.id) alvo = $corpo.querySelector('.task[data-id="' + CSS.escape(q.id) + '"] .abrir');
  if (!alvo && q && q.id) alvo = $corpo.querySelector('.mini[data-id="' + CSS.escape(q.id) + '"]');
  if (!alvo && q && q.data) alvo = $corpo.querySelector('section.dia[data-data="' + q.data + '"] .gap, .mlist[data-data="' + q.data + '"] .gap, .col[data-data="' + q.data + '"] .livre');
  (alvo || $btNovo).focus({ preventScroll: true });
}

// Tudo vale ao salvar: 1) grava as fotos novas (falhou uma: nada é salvo); 2) grava a tarefa;
// 3) só com a tarefa salva apaga as fotos removidas; 4) a tarefa não salvou: apaga as novas recém-gravadas.
// Se a folha fechar durante a gravação (Voltar, outra janela), tudo é descartado.
// Salvar não deu certo e a folha continua aberta: tudo volta a valer, e o foco que o Salvar
// desabilitado soltou volta para ele.
function liberarFolha(minha) {
  minha.salvando = false;
  minha.gravando = null;
  atualizarSalvar();
  desenharFotos();
  if (document.activeElement === document.body && !$btSalvar.disabled) $btSalvar.focus({ preventScroll: true });
}
async function salvarFolha(e) {
  e.preventDefault();
  const minha = folha;
  if (!minha || minha.salvando || minha.preparando) return;
  const titulo = $titulo.value.trim();
  if (!titulo) return;
  // Tudo lido antes da primeira espera: o que se salva é a folha no instante do toque.
  const campos = { titulo, data: minha.data, hora: minha.hora, cat: minha.cat, nota: Nucleo.normalizarNota($nota.value) };
  const lista = fotosFolha.slice();
  const novas = lista.filter((f) => f.nova);
  const ids = lista.map((f) => f.id);
  const gravadas = [];
  let persistido = false;
  minha.salvando = true;
  minha.gravando = novas.map((f) => f.id);
  try {
    atualizarSalvar();
    desenharFotos();
    try {
      for (const f of novas) {
        if (folha !== minha) break; // fechou no meio: não grava o resto
        await Fotos.guardar(f.id, f.blob);
        gravadas.push(f.id);
      }
    } catch (err) {
      console.warn('Agenda: não consegui guardar as fotos', err);
      apagarFotosSemEsperar(gravadas);
      if (folha === minha) {
        liberarFolha(minha);
        avisarFotos();
      }
      return;
    }
    if (folha !== minha) { apagarFotosSemEsperar(gravadas); return; }

    let ok;
    let removidas = [];
    if (minha.id) {
      const t = estado.tarefas.find((x) => x.id === minha.id);
      if (!t) { apagarFotosSemEsperar(gravadas); fecharPainel(); return; }
      const copia = Object.assign({}, t);
      const restaurar = () => { Object.keys(t).forEach((k) => delete t[k]); Object.assign(t, copia); };
      try {
        Object.assign(t, campos, { fotos: ids });
        ok = salvar();
      } catch (err) { restaurar(); throw err; }
      if (ok) {
        removidas = (copia.fotos || []).filter((id) => !ids.includes(id));
      } else if ('fotos' in copia) {
        t.fotos = copia.fotos; // as fotos só mudam se a gravação der certo
      } else {
        delete t.fotos;
      }
    } else {
      let nova = null;
      try {
        nova = Nucleo.novaTarefa(Object.assign({}, campos, { fotos: ids }), new Date());
        estado.tarefas.push(nova);
        ok = salvar();
      } catch (err) {
        const i = nova ? estado.tarefas.indexOf(nova) : -1;
        if (i >= 0) estado.tarefas.splice(i, 1);
        throw err;
      }
      if (!ok) nova.fotos = [];
    }
    persistido = ok;
    if (!ok) apagarFotosSemEsperar(gravadas);
    render();
    fecharPainel();
    avisarFalha(ok);
    apagarFotosSemEsperar(removidas);
  } catch (err) {
    // Erro inesperado: a tarefa não gravada volta ao que era e as fotos recém-gravadas somem.
    console.warn('Agenda: erro ao salvar o compromisso', err);
    if (!persistido) apagarFotosSemEsperar(gravadas);
    if (folha === minha) {
      if (persistido) fecharPainel(); // já está no aparelho: só a tela falhou
      else liberarFolha(minha);
    }
    if (!persistido) toast(MSG_FALHA);
  }
}

// Arrastar o topo da folha (alça e título) para baixo além de 80px fecha.
let alca = null;
function ligarAlca(topo, elFolha) {
  topo.addEventListener('pointerdown', (e) => {
    if (painel !== elFolha || alca) return;
    alca = { pid: e.pointerId, y0: e.clientY, dy: 0 };
    topo.setPointerCapture(e.pointerId);
    elFolha.classList.add('arrastando');
  });
  topo.addEventListener('pointermove', (e) => {
    if (!alca || e.pointerId !== alca.pid || painel !== elFolha) return;
    alca.dy = Math.max(0, e.clientY - alca.y0);
    elFolha.style.transform = 'translateY(' + alca.dy + 'px)';
  });
  const soltar = (e) => {
    if (!alca || e.pointerId !== alca.pid) return;
    const fechar = e.type === 'pointerup' && alca.dy > 80;
    alca = null;
    elFolha.classList.remove('arrastando');
    if (fechar) fecharPainel(); else elFolha.style.transform = '';
  };
  topo.addEventListener('pointerup', soltar);
  topo.addEventListener('pointercancel', soltar);
}

const CHAVE_BACKUP = 'agenda.ultimoBackup';
const $ajustes = document.getElementById('ajustes');

function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
function textoUltimoBackup() {

  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function desenharUltimoBackup() {

// Nome da categoria: ao sair do campo (ou Enter) apara; vazio volta ao nome anterior.
function confirmarNomeCat(cat, campo) {
  const nome = campo.value.trim();
  if (!nome) {
    campo.value = cat.nome;
    toast('O nome não pode ficar vazio.');
    return;
  }
  campo.value = nome;
  if (nome === cat.nome) return;
  cat.nome = nome;

  render();

}
function elLinhaCat(cat) {
  const lin = el('div', 'aj-cat');
  const bolinha = el('i', 'aj-dot');
  bolinha.style.setProperty('--c', cat.cor);
  bolinha.setAttribute('aria-hidden', 'true');

function desenharAjustes() {
  fecharConfirmacao(false);
  const secCats = el('section', 'aj-sec');

  const alvo = ajTamanho;
  Promise.resolve().then(() => calcularTamanho(alvo)); // depois de abrirPainel marcar os Ajustes como abertos
}

// Soma dos blobs das fotos em uso x 1,37 (base64). Ignora o resultado se os Ajustes fecharam ou foram redesenhados.
async function calcularTamanho(alvo) {
  let bytes = 0;
  try {
    for (const id of Nucleo.idsFotos(estado.tarefas)) {
      const b = await Fotos.ler(id);
      if (b) bytes += b.size;
    }
  } catch (e) {
    console.warn('Agenda: não consegui calcular o tamanho das fotos', e);
    if (ajTamanho === alvo && alvo.isConnected && painel === $ajustes) alvo.textContent = 'Tamanho aproximado: indisponível';
    return;
  }
  if (ajTamanho !== alvo || !alvo.isConnected || painel !== $ajustes) return;
  const mb = bytes * 1.37 / (1024 * 1024);
  alvo.textContent = 'Tamanho aproximado: ' + (mb < 0.1 ? 'menos de 0,1 MB' : mb.toFixed(1).replace('.', ',') + ' MB');
}
// Chaves 'agenda.v1.corrompido*' guardadas quando o agenda.v1 estava ilegível, em ordem.
function chavesCorrompidas() {
  const chaves = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CHAVE_CORROMPIDO)) chaves.push(k);
    }
  } catch (e) { console.warn('Agenda: não consegui listar o armazenamento', e); }
  return chaves.sort();
}
function baixarArquivo(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = el('a');
  a.href = url;
  a.download = nome;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
// Uma chave: o texto cru dela. Várias: cada uma sob um cabeçalho com o nome da chave.
function baixarDadosAntigos() {
  const chaves = chavesCorrompidas();
  if (!chaves.length) return;
  const textos = chaves.map((k) => lerArmazenado(k) || '');
  const conteudo = chaves.length === 1 ? textos[0] : chaves.map((k, i) => '===== ' + k + ' =====\n' + textos[i]).join('\n\n');
  const nome = 'agenda-dados-antigos-' + Nucleo.isoDia(new Date()) + '.txt';
  baixarArquivo(nome, conteudo, 'text/plain');
  toast('Dados antigos salvos: ' + nome, { ms: 5000 });
}

function abrirAjustes() {
  if (painel) return;
  desenharAjustes();
  $ajCorpo.scrollTop = 0;
  abrirPainel($ajustes, {}, document.getElementById('ajustes-titulo')); // sem abrir o teclado sobre o backup
}

// Lê do IndexedDB as fotos que as tarefas referenciam e devolve { id: dataURL }. Foto ausente é pulada.
async function mapaDeFotos(tarefas) {
  const mapa = {};
  for (const id of Nucleo.idsFotos(tarefas)) {
    const blob = await Fotos.ler(id);
    if (blob) mapa[id] = await Fotos.paraDataUrl(blob);
  }
  return mapa;
}
let exportando = false;
async function exportarBackup(botao) {
  if (exportando) return;
  exportando = true;
  const rotulo = botao ? botao.textContent : '';
  if (botao) { botao.disabled = true; botao.textContent = 'Preparando backup…'; }
  try {
    const instantaneo = { tarefas: estado.tarefas, cats: estado.cats };
    const agora = new Date();
    const { nome, conteudo } = Nucleo.exportar(instantaneo, agora, await mapaDeFotos(instantaneo.tarefas));
    baixarArquivo(nome, conteudo, 'application/json');
    gravarArmazenado(CHAVE_BACKUP, agora.toISOString());
    if (ajBackup && ajBackup.isConnected) desenharUltimoBackup();
    toast('Backup salvo: ' + nome, { ms: 5000 });
  } catch (e) {
    console.warn('Agenda: backup não preparado', e);
    toast('Não foi possível preparar o backup.');
  } finally {
    exportando = false;
    if (botao) { botao.disabled = false; botao.textContent = rotulo; }
  }
}

// Confirmação de importação, dentro da folha: as outras seções ficam inertes até responder.
function fecharConfirmacao(devolverFoco = true) {
  if (!ajConf) return false;
  const { caixa, secoes } = ajConf;
  ajConf = null;
  caixa.remove();
  secoes.forEach((s) => { s.inert = false; });
  if (devolverFoco && painel === $ajustes) (document.getElementById('aj-importar') || document.getElementById('aj-fechar')).focus();
  return true;
}
function pedirConfirmacao(backup) {
  fecharConfirmacao(false);
  const n = backup.tarefas.length;
  const caixa = el('div', 'aj-conf');
  caixa.setAttribute('role', 'group');
  caixa.setAttribute('aria-labelledby', 'aj-conf-t');
  const t = el('p', '', plural(n, 'compromisso', 'compromissos') + ' no arquivo');
  t.id = 'aj-conf-t';
  const aviso = el('small', '', '"Substituir tudo" apaga os compromissos atuais. "Juntar" mantém os atuais e acrescenta os que faltam.');
  const bSub = el('button', 'bt-apagar', 'Substituir tudo');
  bSub.type = 'button';
  const bJun = el('button', 'btn', 'Juntar');
  bJun.type = 'button';
  const bCan = el('button', 'btn-sec', 'Cancelar');
  bCan.type = 'button';
  bSub.addEventListener('click', () => aplicarImportacao(backup, false));
  bJun.addEventListener('click', () => aplicarImportacao(backup, true));
  bCan.addEventListener('click', () => fecharConfirmacao());
  caixa.append(t, aviso, bSub, bJun, bCan);
  const secoes = [...$ajCorpo.querySelectorAll('.aj-sec')];
  secoes.forEach((s) => { s.inert = true; });
  $ajCorpo.prepend(caixa);
  ajConf = { caixa, secoes };
  $ajCorpo.scrollTop = 0;
  bCan.focus();
}
const CHAVE_ANTES_IMPORTACAO = 'agenda.v1.antesImportacao';
// Antes de importar, guarda a agenda atual em CHAVE_ANTES_IMPORTACAO (sobrescrita a cada importação)
// e oferece "Desfazer" no aviso.
let importando = false;
async function aplicarImportacao(backup, juntar) {
  if (importando) return;
  importando = true;
  // Um "Desfazer" de apagar ainda pendente vira definitivo agora, antes de olhar o que existe no banco.
  fecharToast();
  fotosImportacao = Object.keys(backup.fotos || {});
  try { await importar(backup, juntar); } finally { importando = false; fotosImportacao = []; }
}
async function importar(backup, juntar) {
  // Fotos primeiro (as do arquivo que o banco ainda não tem). Qualquer falha desfaz tudo.
  const gravadas = [];
  const usadas = Nucleo.idsFotos(backup.tarefas).filter((id) => Object.prototype.hasOwnProperty.call(backup.fotos || {}, id));
  if (usadas.length) {
    try {
      const jaTem = new Set(await Fotos.listarIds());
      for (const id of usadas) {
        if (jaTem.has(id)) continue;
        const blob = Fotos.deDataUrl(backup.fotos[id]);
        await Fotos.guardar(id, blob);
        gravadas.push(id);
      }
    } catch (e) {
      console.warn('Agenda: fotos do backup não foram gravadas', e);
      apagarFotosSemEsperar(gravadas);
      avisarFotos();
      fecharConfirmacao();
      return;
    }
  }
  // O estado só é lido agora: mudanças feitas durante a gravação das fotos não se perdem.
  const anterior = estado;
  const antes = anterior.tarefas.length;
  const novo = juntar ? Nucleo.juntar(anterior, backup) : { tarefas: backup.tarefas, cats: backup.cats };
  if (!gravarArmazenado(CHAVE_ANTES_IMPORTACAO, JSON.stringify(anterior))) {
    console.warn('Agenda: cópia de antes da importação não foi guardada; o Desfazer do aviso ainda vale.');
  }
  estado = novo;
  if (!salvar()) {
    estado = anterior;
    apagarFotosSemEsperar(gravadas);
    toast(MSG_FALHA);
    fecharConfirmacao();
    return;
  }
  render();
  desenharAjustes();
  const n = estado.tarefas.length - antes;
  toast('Backup importado: ' + (juntar ? plural(n, 'compromisso adicionado', 'compromissos adicionados') : plural(estado.tarefas.length, 'compromisso', 'compromissos')), {
    rotulo: 'Desfazer',
    ms: 8000,
    acao: () => {
      estado = anterior;
      const ok = salvar();
      render();
      if (painel === $ajustes) desenharAjustes();
      toast(ok ? 'Importação desfeita.' : MSG_FALHA);
    },
  });
  document.getElementById('aj-fechar').focus();
}
$arquivo.addEventListener('change', async () => {
  const arquivo = $arquivo.files && $arquivo.files[0];
  if (!arquivo) return;
  let obj;
  try {
    obj = JSON.parse(await arquivo.text());
  } catch (e) {
    $arquivo.value = '';
    toast('Este arquivo não é um backup da Agenda.');
    return;
  }
  $arquivo.value = '';
  const r = Nucleo.validarBackup(obj);
  if (!r.ok) { toast(r.erro); return; }
  if (painel === $ajustes) pedirConfirmacao(r);
});

// Virou o dia: redesenha e vai para hoje. Na Semana, só acompanha se a semana de hoje estava na tela;
// no Mês, se o mês atual estava na tela com o dia de hoje selecionado.
function virar() {
  const seguia = aba === 'semana' ? semanaInicio === Nucleo.inicioSemana(diaAtual)
    : aba === 'mes' ? mesIso === primeiroDoMes(diaAtual) && diaSel === diaAtual
    : true;
  render();
  if (seguia) irParaHoje(false);
}

// Recalcula "hoje" (meia-noite, volta do segundo plano) e o traço "agora".
// Com a folha aberta, a virada espera ela fechar para não redesenhar nem rolar por baixo dela.
function tique() {
  if (hojeIso() !== diaAtual) {
    if (painel) { viradaPendente = true; return; }
    virar();
  } else if (aba === 'linha') {
    atualizarAgora();
  }
}

// ---- início ----
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => trocarAba(b.dataset.aba)));
document.getElementById('bt-hoje').addEventListener('click', () => irParaHoje(true));
document.getElementById('bt-ajustes').addEventListener('click', () => abrirAjustes());
$btNovo.addEventListener('click', () => abrirFolha());
let cabecalhoPendente = false;
$corpo.addEventListener('scroll', () => {
  if (aba !== 'linha' || cabecalhoPendente) return;
  cabecalhoPendente = true;
  requestAnimationFrame(() => { cabecalhoPendente = false; atualizarCabecalho(); });
}, { passive: true });
addEventListener('resize', () => { if (aba === 'linha') ajustarFim(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tique(); });
setInterval(tique, 60000);

// Outra cópia aberta (ex.: a aba do navegador ao lado do app instalado) gravou: adota os dados dela,
// para esta cópia não sobrescrever o que é mais novo. Texto ilegível ou apagado é ignorado.
addEventListener('storage', (e) => {
  if (e.key !== CHAVE || e.newValue === null) return;
  const r = Nucleo.carregar(e.newValue);
  if (r.corrompido) return;
  if (painel) fecharPainel(); // a folha editaria objetos do estado antigo
  estado = r.estado;
  leituraFalhou = false; // agora há dados lidos de verdade
  render();
  toast('Agenda atualizada em outra janela.');
});

// Pede ao navegador para não despejar os dados quando o aparelho estiver sem espaço.
try {
  const p = navigator.storage && navigator.storage.persist && navigator.storage.persist();
  if (p && p.catch) p.catch((e) => console.warn('Agenda: storage.persist falhou', e));
} catch (e) { console.warn('Agenda: storage.persist falhou', e); }

render();
irParaHoje(false);
// Limpa fotos órfãs sem bloquear a tela. Só se o estado foi lido de verdade (senão tudo pareceria órfão).
if (!leituraFalhou && textoCorrompido === null) {
  Fotos.limparOrfas(idsFotosEmUso).catch((e) => console.warn('Agenda: limpeza de fotos falhou', e));
}
if (leituraFalhou) toast('Não foi possível ler os dados do aparelho.', { ms: 6000 });
// agenda.v1 ilegível: guarda o texto à parte já no início (agenda.v1 fica intocado) e avisa uma vez.
if (textoCorrompido !== null) {
  toast(guardarCorrompido() ? 'Dados antigos ilegíveis foram guardados à parte.' : MSG_FALHA, { ms: 6000 });
}
// PWA: service worker só em http(s) (em file:// não há SW).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('Service worker não registrado:', e));
}
</script>
